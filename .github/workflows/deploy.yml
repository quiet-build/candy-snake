name: Deploy

# Thin caller — actual build + deploy logic lives in
# quiet-build/.github/.github/workflows/deploy-static-site.yml

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: quiet-build/.github/.github/workflows/deploy-static-site.yml@main
    secrets:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
