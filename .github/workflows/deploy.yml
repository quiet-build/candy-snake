name: Deploy arcade component

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: write
    uses: quiet-build/.github/.github/workflows/deploy-arcade-component.yml@f874ec46eb04fef8b85cd95ee6dca62b35e526ec
    with:
      support-sha: f874ec46eb04fef8b85cd95ee6dca62b35e526ec
      cloudflare-project-name: candy-snake
      prebuild-command: "pnpm test"
      postbuild-command: "pnpm exec playwright test --config playwright.component.config.js"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
